#f8fafc" stroke="#d8e0e7"/><text x="120" y="987" class="zoneTitle" style="font-size:20px">LEGENDA OPERACIONAL</text><rect x="390" y="970" width="22" height="22" rx="4" fill="#147a50"/><text x="422" y="987" class="small">Ponto de encontro</text><line x1="620" y1="981" x2="680" y2="981" stroke="#147a50" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow)"/><text x="700" y="987" class="small">Fluxo geral de circulação / evacuação</text><rect x="1060" y="970" width="24" height="24" rx="5" fill="#0e4f7a"/><text x="1095" y="987" class="small">Acesso do Corpo de Bombeiros</text><text x="120" y="1018" class="tiny">ATENÇÃO: este mapa é apenas para orientação rápida. Posição exata de hidrantes, extintores, válvulas, detecção e rotas deve ser confirmada nas pranchas PSCIP e em campo.</text></svg>